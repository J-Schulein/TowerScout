name: Task-087 Frontend Puppeteer Templates

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - feature/task-087-gate3-product-integration
      - main

jobs:
  puppeteer-templates:
    name: Run Puppeteer templates (Task-087)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1

      - name: Install Node dependencies (lockfile)
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
        run: npm ci --no-audit --no-fund

      - name: Install lightweight test utilities
        run: npm install --no-audit --no-fund --no-save http-server wait-on

      - name: Start static web server for tests
        # Use a lightweight static server to avoid starting the full Python app in CI
        run: npx http-server ./webapp -p 5000 -c-1 &

      - name: Wait for web server
        run: npx wait-on http://localhost:5000 --timeout 30000

      - name: Run live POST/poll Puppeteer template
        env:
          CI: true
        run: node tests/frontend/test_provider_tls_live_post_poll_template.js

      - name: Run helper-unavailable Puppeteer template
        env:
          CI: true
        run: node tests/frontend/test_provider_tls_helper_unavailable_template.js

  puppeteer-e2e:
    name: Run Puppeteer e2e (simulated helper)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1

      - name: Install Node dependencies (lockfile)
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
        run: npm ci --no-audit --no-fund

      - name: Install lightweight test utilities
        run: npm install --no-audit --no-fund --no-save http-server wait-on

      - name: Start simulated helper (port 5001)
        run: node tests/helpers/simulated_helper.js &

      - name: Start static web server for tests (port 5000)
        run: npx http-server ./webapp -p 5000 -c-1 &

      - name: Wait for services
        run: npx wait-on http://localhost:5000 http://localhost:5001 --timeout 30000

      - name: Run live POST/poll Puppeteer e2e
        env:
          CI: true
          TEST_HELPER_BASE_URL: http://localhost:5001
          E2E_USE_SERVER: '1'
        run: node tests/frontend/test_provider_tls_live_post_poll_template.js

      - name: Run helper-unavailable Puppeteer e2e
        env:
          CI: true
          TEST_HELPER_BASE_URL: http://localhost:5001
          E2E_USE_SERVER: '1'
        run: node tests/frontend/test_provider_tls_helper_unavailable_template.js
